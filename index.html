<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2A6B">
<title>GinnyLearn</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --carta:#FDFDF8; --quadretto:#DCE8F3; --margine:#F2A7A7;
  --inchiostro:#1B2A6B; --inchiostro-2:#4A5799; --rosso:#E5383B; --giallo:#FFC93C;
  --mate:#4361EE; --storia:#D9820B; --geo:#219A5B;
  --ok:#2BB673; --ko:#E5383B;
  --r-s:10px; --r-m:18px; --r-l:28px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:"Baloo 2",system-ui,sans-serif; color:var(--inchiostro); background:var(--carta);
  background-image:
    linear-gradient(90deg,transparent 46px,var(--margine) 46px,var(--margine) 48px,transparent 48px),
    linear-gradient(var(--quadretto) 1px,transparent 1px),
    linear-gradient(90deg,var(--quadretto) 1px,transparent 1px);
  background-size:100% 100%,24px 24px,24px 24px;
  font-size:18px; line-height:1.35; overscroll-behavior:none; user-select:none;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--giallo);outline-offset:3px}
.penna{font-family:"Kalam",cursive}
#app{max-width:980px;margin:0 auto;padding:18px 18px 110px 66px;min-height:100%}
h1,h2,h3{margin:0;line-height:1.1}
h1{font-size:40px;font-weight:800}
h2{font-size:26px;font-weight:800;margin:28px 0 12px}
.muted{color:var(--inchiostro-2)}

/* header */
.top{display:flex;align-items:center;gap:14px}
.avatar{width:64px;height:64px;border-radius:50%;background:#fff;border:3px solid var(--inchiostro);display:grid;place-items:center;font-size:36px;flex:none}
.stelle-tot{margin-left:auto;background:var(--giallo);border:3px solid var(--inchiostro);border-radius:999px;padding:4px 16px;font-weight:800;font-size:22px;box-shadow:3px 3px 0 var(--inchiostro)}

/* quaderni materie */
.quaderni{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.quaderno{position:relative;text-align:left;border-radius:6px var(--r-m) var(--r-m) 6px;padding:20px 18px 18px 34px;min-height:170px;color:#fff;
  border:3px solid var(--inchiostro);box-shadow:5px 5px 0 var(--inchiostro);transition:transform .12s}
.quaderno:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--inchiostro)}
.quaderno::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:8px;background:repeating-linear-gradient(transparent 0 10px,rgba(255,255,255,.55) 10px 16px)}
.quaderno .ico{font-size:52px;line-height:1}
.quaderno .nome{font-size:30px;font-weight:800;margin-top:6px}
.quaderno .etichetta{position:absolute;right:14px;bottom:14px;background:#fff;color:var(--inchiostro);border-radius:6px;padding:2px 10px;font-size:15px;font-weight:700;transform:rotate(-3deg)}
.bg-matematica{background:var(--mate)} .bg-storia{background:var(--storia)} .bg-geografia{background:var(--geo)}
.c-matematica{color:var(--mate)} .c-storia{color:var(--storia)} .c-geografia{color:var(--geo)}

/* liste */
.riga{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2.5px solid var(--inchiostro);border-radius:var(--r-m);padding:14px 16px;margin-bottom:12px}
.riga .grande{font-size:22px;font-weight:700}
.riga .ico{font-size:34px;flex:none}
.badge-nuovo{background:var(--rosso);color:#fff;border-radius:6px;padding:0 8px;font-size:14px;font-weight:700;transform:rotate(-4deg);display:inline-block;margin-left:6px}
.stelline{margin-left:auto;font-size:22px;letter-spacing:2px;white-space:nowrap}
.indietro{font-size:20px;font-weight:700;padding:6px 0;margin-bottom:6px}

/* compiti */
.giorno{margin:22px 0 8px;font-size:22px;font-weight:800}
.compito{display:flex;align-items:flex-start;gap:14px;background:#fff;border:2.5px solid var(--inchiostro);border-left-width:10px;border-radius:var(--r-s);padding:12px 14px;margin-bottom:10px}
.compito.matematica{border-left-color:var(--mate)} .compito.storia{border-left-color:var(--storia)} .compito.geografia{border-left-color:var(--geo)}
.spunta{width:40px;height:40px;flex:none;border:3px solid var(--inchiostro);border-radius:8px;background:#fff;font-size:32px;line-height:30px;color:var(--rosso);font-family:Kalam,cursive}
.compito.fatto .testo{text-decoration:line-through;text-decoration-color:var(--rosso);text-decoration-thickness:3px;opacity:.6}
.compito .testo{font-size:20px;font-weight:600}
.compito .meta{font-size:15px}
.verifica{white-space:nowrap;background:var(--rosso);color:#fff;border-radius:6px;padding:0 8px;font-size:14px;font-weight:700;margin-left:6px}
.btn{color:var(--inchiostro);display:inline-flex;align-items:center;gap:8px;background:var(--giallo);border:3px solid var(--inchiostro);border-radius:999px;padding:8px 20px;font-weight:800;font-size:20px;box-shadow:3px 3px 0 var(--inchiostro)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--inchiostro)}
.btn.piccolo{font-size:16px;padding:4px 14px;margin-top:8px}
.btn.bianco{background:#fff}
.vuoto{background:#fff;border:2.5px dashed var(--inchiostro-2);border-radius:var(--r-m);padding:22px;text-align:center}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--inchiostro);z-index:5}
nav button{color:#fff;display:flex;flex-direction:column;align-items:center;font-size:15px;font-weight:700;padding:4px 22px;border-radius:14px;opacity:.7}
nav button span{font-size:28px;line-height:1.1}
nav button.on{opacity:1;background:rgba(255,255,255,.14)}

/* premi */
.medaglie{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.medaglia{background:#fff;border:2.5px solid var(--inchiostro);border-radius:var(--r-m);padding:14px;text-align:center}
.medaglia .ico{font-size:44px}
.medaglia.bloccata{filter:grayscale(1);opacity:.45}
.avatars{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.avatars button{font-size:34px;width:58px;height:58px;border-radius:50%;background:#fff;border:3px solid transparent}
.avatars button.on{border-color:var(--inchiostro)}
input[type=text]{font:inherit;font-size:22px;padding:8px 14px;border:3px solid var(--inchiostro);border-radius:var(--r-s);width:min(320px,100%);color:var(--inchiostro)}

/* ===== GIOCO ===== */
.gioco{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;overflow:hidden}
.mondo-spazio{background:radial-gradient(circle at 20% 15%,#2a3a8f 0,#10194A 55%,#070C2B 100%);color:#fff}
.mondo-spazio::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(1.5px 1.5px at 10% 20%,#fff,transparent),radial-gradient(1px 1px at 30% 70%,#fff,transparent),radial-gradient(2px 2px at 80% 30%,#ffe9a8,transparent),radial-gradient(1px 1px at 60% 85%,#fff,transparent),radial-gradient(1.5px 1.5px at 90% 75%,#fff,transparent),radial-gradient(1px 1px at 45% 40%,#fff,transparent);background-size:340px 340px}
.mondo-papiro{background:#F1DDAA;color:#4A2C0A;background-image:radial-gradient(ellipse at 50% 0,rgba(255,255,255,.5),transparent 60%),repeating-linear-gradient(0deg,rgba(120,80,20,.06) 0 2px,transparent 2px 7px)}
.mondo-mare{background:linear-gradient(#8FD8EE,#3BA7CF);color:#073B4C}
.mondo-mare::before{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;pointer-events:none;opacity:.35;
  background:radial-gradient(circle at 50% 0,transparent 22px,#fff 23px,#fff 26px,transparent 27px) 0 0/60px 40px repeat-x}
.hud{position:relative;display:flex;align-items:center;gap:14px;padding:14px 18px 6px;font-weight:800;font-size:22px}
.hud .chiudi{font-size:28px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.2)}
.mondo-papiro .hud .chiudi{background:rgba(74,44,10,.12)}
.hud .punti{margin-left:auto}
.hud .fuoco{min-width:60px}
.pista{position:relative;margin:4px 24px 0;height:44px}
.pista .linea{position:absolute;left:0;right:34px;top:50%;border-top:4px dashed currentColor;opacity:.35}
.pista .meta{position:absolute;right:0;top:2px;font-size:32px}
.pista .viaggiatore{position:absolute;top:0;font-size:34px;transition:left .5s cubic-bezier(.3,1.4,.5,1);transform:translateX(-50%)}
.mondo-papiro .pista .viaggiatore{transform:translateX(-50%) scaleX(-1)} /* il cavallo guarda a sinistra: lo giriamo verso il traguardo */
.timer{height:10px;margin:6px 24px 0;border-radius:6px;background:rgba(255,255,255,.25);overflow:hidden}
.mondo-papiro .timer{background:rgba(74,44,10,.15)}
.timer i{display:block;height:100%;width:100%;background:var(--giallo);transform-origin:left}
.palco{position:relative;flex:1;overflow:auto;padding:16px 24px 30px;display:flex;flex-direction:column;align-items:center}
.domanda{font-size:30px;font-weight:800;text-align:center;max-width:780px;margin:12px 0 22px}
.lacuna{display:inline-block;min-width:110px;border-bottom:4px solid currentColor;margin:0 4px}
.opzioni{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%;max-width:820px}
.opz{background:#fff;color:var(--inchiostro);border:3px solid var(--inchiostro);border-radius:var(--r-m);padding:18px;font-size:24px;font-weight:700;box-shadow:4px 4px 0 rgba(0,0,0,.35);min-height:76px}
.opz:active{transform:translate(2px,2px)}
.opz.giusta{background:var(--ok);color:#fff;animation:pop .35s}
.opz.sbagliata{background:var(--ko);color:#fff;animation:scuoti .4s}
.opz.spenta{opacity:.45}
.vf{display:flex;gap:18px;width:100%;max-width:700px}
.vf .opz{flex:1;font-size:32px;min-height:120px}
.carta-cat{background:#fff;color:var(--inchiostro);border:3px solid var(--inchiostro);border-radius:var(--r-m);padding:26px 40px;font-size:34px;font-weight:800;margin:20px 0 28px;box-shadow:5px 5px 0 rgba(0,0,0,.35);animation:cala .35s}
.colonne{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px;width:100%;max-width:760px}
.colonne .opz{font-size:22px;min-height:64px;padding:12px}
.opz.scelta{outline:5px solid var(--giallo);outline-offset:2px}
.opz.fatta{background:var(--ok);color:#fff;opacity:.85;box-shadow:none}
.griglia-memory{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:min(640px,calc((100vh - 250px) / 3 * .75 * 4 + 36px))}
.mcard{aspect-ratio:3/4;perspective:800px}
.mcard .dentro{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mcard.girata .dentro,.mcard.presa .dentro{transform:rotateY(180deg)}
.mcard .faccia{position:absolute;inset:0;border-radius:var(--r-m);border:3px solid var(--inchiostro);display:grid;place-items:center;backface-visibility:hidden;padding:8px;text-align:center;font-weight:800;font-size:20px}
.mcard .dorso{background:var(--giallo);font-size:40px}
.mcard .fronte{background:#fff;color:var(--inchiostro);transform:rotateY(180deg)}
.mcard.presa .fronte{background:var(--ok);color:#fff}
.sequenza{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;min-height:70px;margin-bottom:24px;max-width:820px}
.sequenza .tassello{background:var(--ok);color:#fff}
.tassello{background:#fff;color:var(--inchiostro);border:3px solid var(--inchiostro);border-radius:var(--r-s);padding:10px 18px;font-size:24px;font-weight:800;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.tassello .n{font-size:15px;opacity:.8;margin-right:6px}
.mucchio{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:820px}
.caselle{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:10px 0 24px}
.casella{width:54px;height:64px;border-bottom:5px solid currentColor;font-size:38px;font-weight:800;display:grid;place-items:center}
.lettere{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:700px}
.lettera{width:62px;height:62px;font-size:34px;font-weight:800;background:#fff;color:var(--inchiostro);border:3px solid var(--inchiostro);border-radius:12px;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
.lettera.usata{visibility:hidden}
.azioni{display:flex;gap:14px;margin-top:26px}
.scuoti{animation:scuoti .4s}
.punti-volanti{position:fixed;font-size:34px;font-weight:800;color:var(--giallo);text-shadow:2px 2px 0 #000;pointer-events:none;animation:vola .9s forwards;z-index:30}
@keyframes pop{50%{transform:scale(1.07)}}
/* Mia, la guida */
.mia{position:absolute;left:10px;bottom:10px;z-index:5;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.mia img{width:92px;height:auto;filter:drop-shadow(0 3px 4px rgba(0,0,0,.2))}
.mia .fumetto{background:#fff;color:#2a1d3a;border:3px solid #2a1d3a;border-radius:18px 18px 18px 4px;padding:8px 14px;font-weight:800;font-size:18px;max-width:220px;margin-bottom:56px;animation:miaPop .35s cubic-bezier(.3,1.6,.6,1)}
.mia .fumetto:empty{display:none}
.mia-anim-pop img{animation:miaPop .45s cubic-bezier(.3,1.6,.6,1)}
.mia-anim-salta img{animation:miaSalta .45s ease-out 2}
.mia-anim-scuoti img{animation:miaScuoti .45s ease-in-out 2}
.mia-anim-dondola img{animation:miaDondola 3s ease-in-out infinite}
@keyframes miaPop{from{transform:scale(.4);opacity:0}}
@keyframes miaSalta{50%{transform:translateY(-16px)}}
@keyframes miaScuoti{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes miaDondola{50%{transform:translateY(-5px) rotate(-3deg)}}
.mia-corpo{display:block;height:190px;width:auto;margin:0 auto 6px;animation:miaPop .5s cubic-bezier(.3,1.6,.6,1)}
.cartina{position:relative;width:min(100%,520px);margin:8px auto 0;border:3px solid var(--inchiostro);border-radius:14px;overflow:hidden;touch-action:none}
.cartina img{display:block;width:100%;height:100%;user-select:none}
.pin{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;border:3px solid #fff;background:#e0393e;color:#fff;font-size:12px;line-height:1;padding:0;box-shadow:0 2px 4px rgba(0,0,0,.35);cursor:pointer}
.pin-monte{background:#7a5230;border-radius:6px}.pin-fiume,.pin-lago{background:#1f78c8}.pin-regione{background:#6a3fb5}
.pin.fatta{background:#2fa84f}
.pin-et{position:absolute;left:24px;top:-2px;white-space:nowrap;background:#fff;color:var(--inchiostro);border-radius:8px;padding:1px 6px;font-size:13px;font-weight:800}
.cart-nome{display:inline-block;background:#fff;color:var(--inchiostro);border:3px solid var(--inchiostro);border-radius:14px;padding:10px 22px;font-size:26px;font-weight:800;box-shadow:4px 4px 0 rgba(0,0,0,.3);touch-action:none;cursor:grab;position:relative;z-index:6}
.cart-nome.trascina{cursor:grabbing;opacity:.9}
.azioni-compito{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.passati .compito{opacity:.55;filter:grayscale(.6)}
#cerca{width:100%;margin:6px 0 14px}
.finestra{position:fixed;inset:0;z-index:50;background:rgba(10,15,40,.9);overflow:auto;padding:56px 12px 20px;text-align:center}
.finestra .chiudi-f{position:fixed;top:10px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:#fff;font-size:22px;font-weight:800}
.testo-studio{background:#fffdf5;color:var(--inchiostro);border-radius:16px;padding:22px 26px;max-width:620px;margin:0 auto;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.testo-studio h2{margin:0 0 2px;font-size:28px}.testo-studio .autore{font-style:italic;opacity:.75;margin-bottom:16px}
.testo-studio .verso{font-size:23px;line-height:1.5;font-weight:600}.testo-studio .stacco{height:18px}
.finestra img.pagina{max-width:100%;border-radius:10px;background:#fff}
.zaino{background:#fff;border-radius:14px;padding:12px 16px;margin:0 auto 12px;max-width:900px;font-size:19px;text-align:left}
.guide{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.guide button{background:#fff;border:3px solid transparent;border-radius:18px;padding:8px;font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.guide button.on{border-color:var(--blu,#1B2A6B);box-shadow:0 0 0 4px rgba(27,42,107,.15)}
.guide img{width:72px;height:72px;object-fit:contain}
.mia-casa{display:flex;align-items:flex-end;gap:10px;margin:4px 0 10px}
.mia-casa img{height:150px;width:auto}
.mia-casa .fumetto{position:static;background:#fff;border:3px solid var(--inchiostro);border-radius:18px 18px 18px 4px;padding:10px 16px;font-weight:800;font-size:20px;margin-bottom:60px}
@media (max-height:620px){.mia img{width:70px}.mia-corpo{height:140px}}
/* tablet in verticale: la guida sta in alto, sotto la pista, con il fumetto accanto alla domanda */
@media (orientation:portrait){
  .gioco .mia{position:relative;left:auto;bottom:auto;align-self:center;align-items:center;min-height:78px;margin:6px 16px 0;max-width:820px;width:calc(100% - 32px)}
  .gioco .mia img{width:72px}
  .gioco .mia .fumetto{margin-bottom:0;max-width:none;font-size:20px}
  .gioco .palco{padding-top:4px}
  .gioco .domanda{margin-top:4px}
}
@keyframes scuoti{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes vola{to{transform:translateY(-80px);opacity:0}}
@keyframes cala{from{transform:translateY(-30px) rotate(-4deg);opacity:0}}

/* fine partita */
.fine{text-align:center;margin:auto;padding:20px}
.fine .stelle-grandi{font-size:84px;letter-spacing:8px;margin:10px 0}
.fine .stelle-grandi span{display:inline-block;animation:timbro .45s backwards}
.fine .stelle-grandi span:nth-child(2){animation-delay:.25s}
.fine .stelle-grandi span:nth-child(3){animation-delay:.5s}
.fine .stelle-grandi .spenta{filter:grayscale(1);opacity:.35}
@keyframes timbro{from{transform:scale(2.4) rotate(-20deg);opacity:0}}
.fine h1{font-size:46px}
.record{display:inline-block;background:var(--rosso);color:#fff;padding:4px 16px;border-radius:8px;transform:rotate(-3deg);font-size:24px;margin-top:6px}
.coriandoli{position:fixed;inset:0;pointer-events:none;z-index:20}

.chip-foto{display:inline-block;margin:8px 6px 0 0;padding:3px 10px;border-radius:999px;background:#DDF5E3;color:#1C6B34;font-weight:700;font-size:15px}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--inchiostro);color:#fff;padding:12px 22px;border-radius:999px;font-weight:700;z-index:40;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:cala .3s}
@media (max-width:600px){#app{padding-left:58px} h1{font-size:32px} .domanda{font-size:24px} .griglia-memory{grid-template-columns:repeat(3,1fr);max-width:none} .opzioni{grid-template-columns:1fr} .colonne{gap:12px}}
/* home divisa in due: sopra i compiti, sotto le materie, ognuno scorre per conto suo */
body.in-casa #app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.casa{flex:1;min-height:0;display:flex;flex-direction:column}
.casa .top{flex:none}
.casa .top .mia-casa{margin:0 0 0 auto}
.casa .top .mia-casa img{height:84px}
.casa .top .mia-casa .fumetto{margin-bottom:34px;font-size:16px;padding:6px 12px;max-width:240px}
.zona-testa{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
.zona-testa h2{margin:0 auto 0 0}
.zona-testa .btn.piccolo{margin-top:0}
.zona{flex:1 1 0;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:2px 8px 10px 2px;border-top:2px dashed var(--quadretto);border-bottom:2px dashed var(--quadretto)}
.zona .quaderni{padding:4px 6px 6px 0}
@media (max-width:700px){.casa .top .mia-casa{display:none}}
.chip-piano{display:inline-block;background:#EFE7FF;color:#4b2a8a;border-radius:8px;padding:0 8px;font-size:14px;font-weight:700;margin-left:6px}
/* Il mio piano */
.piano-aiuto{background:#fff;border:2.5px dashed var(--inchiostro-2);border-radius:var(--r-m);padding:10px 14px;margin:8px 0 12px;font-size:17px}
.da-org{background:#FFF7DA;border:3px solid var(--inchiostro);border-radius:var(--r-m);padding:10px;min-height:70px;margin-bottom:16px}
.da-org.bersaglio,.giorno-box.bersaglio{outline:4px dashed var(--giallo);outline-offset:2px}
.piano-giorni{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.giorno-box{background:#fff;border:2.5px solid var(--inchiostro);border-radius:var(--r-m);padding:8px;min-height:130px;text-align:left;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.giorno-box.festa{background:#F4F8FF}
.giorno-box.pieno{border-color:var(--rosso)}
.giorno-box .gtesta{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:19px}
.giorno-box .gtesta small{font-size:14px;color:var(--inchiostro-2)}
.consegne{font-size:13px;color:var(--inchiostro-2);line-height:1.25}
.avviso{font-size:14px;font-weight:800;color:var(--rosso)}
.carta-piano{display:flex;align-items:flex-start;gap:8px;line-height:1.2;background:#fff;border:2.5px solid var(--inchiostro);border-left-width:9px;border-radius:12px;padding:6px 8px;font-size:16px;font-weight:600;text-align:left;width:100%;box-shadow:2px 2px 0 rgba(0,0,0,.15)}
.carta-piano.scelta{outline:4px solid var(--giallo);outline-offset:1px;transform:rotate(-1.5deg)}
.carta-piano.fatto .ct{text-decoration:line-through;opacity:.55}
.carta-piano .ct{flex:1;min-width:0;overflow-wrap:anywhere}
.carta-piano .sotto{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px}
.carta-piano .sotto small{font-size:13px;color:var(--inchiostro-2)}
.carta-piano .tempo{flex:none;background:#E6F3FF;border-radius:8px;padding:0 6px;font-size:14px;font-weight:800}
.carta-piano .spunta{width:30px;height:30px;font-size:24px;line-height:22px}
.da-org .carte{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<div id="app"></div>
<nav id="nav">
  <button data-go="#/casa"><span>🏠</span>Casa</button>
  <button data-go="#/compiti"><span>📒</span>Compiti</button>
  <button data-go="#/piano"><span>🗓️</span>Piano</button>
  <button data-go="#/premi"><span>🏆</span>Premi</button>
</nav>
<script>
'use strict';
/* ---------- utilità ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mescola = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const carica = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const salva = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
const oggiISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const GIORNI = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function nomeGiorno(iso) {
  const oggi = new Date(oggiISO()), d = new Date(iso), diff = Math.round((d - oggi) / 864e5);
  if (diff === 0) return 'Oggi';
  if (diff === 1) return 'Domani';
  if (diff === -1) return 'Ieri';
  const s = `${GG[d.getDay()]} ${d.getDate()} ${MESI[d.getMonth()]}`;
  return s[0].toUpperCase() + s.slice(1);
}
function toast(t, ms = 3200) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.append(el); setTimeout(() => el.remove(), ms); }

/* ---------- dati ---------- */
const MATERIE_BASE = {
  matematica: { nome: 'Matematica', icona: '🚀', mondo: 'spazio' },
  storia: { nome: 'Storia', icona: '🏺', mondo: 'papiro' },
  geografia: { nome: 'Geografia', icona: '🧭', mondo: 'mare' },
  italiano: { nome: 'Italiano', icona: '📖', mondo: 'papiro', colore: '#F28B9B' },
  inglese: { nome: 'Inglese', icona: '💂', mondo: 'mare', colore: '#B98AE0' },
  scienze: { nome: 'Scienze', icona: '🔬', mondo: 'spazio', colore: '#8E9BE8' },
  civica: { nome: 'Ed. Civica', icona: '🤝', mondo: 'papiro', colore: '#E8D35A' },
  tecnologia: { nome: 'Tecnologia', icona: '💻', mondo: 'spazio', colore: '#9AA7B8' },
  arte: { nome: 'Arte e Immagine', icona: '🎨', mondo: 'papiro', colore: '#E58AD8' },
  musica: { nome: 'Musica', icona: '🎵', mondo: 'mare', colore: '#F2B57A' },
  strumento: { nome: 'Strumento', icona: '🎻', mondo: 'mare', colore: '#F5A86B' },
  motoria: { nome: 'Motoria', icona: '⚽', mondo: 'mare', colore: '#5FD6B9' },
  religione: { nome: 'Religione', icona: '🕊️', mondo: 'papiro', colore: '#C9CED6' }
};
// nomi del registro -> chiave materia
function normMateria(s) {
  s = (s || '').toLowerCase();
  const regole = [['ingl', 'inglese'], ['mate', 'matematica'], ['stor', 'storia'], ['geog', 'geografia'], ['scien', 'scienze'],
    ['civic', 'civica'], ['tecn', 'tecnologia'], ['arte', 'arte'], ['immag', 'arte'], ['strum', 'strumento'], ['music', 'musica'],
    ['motor', 'motoria'], ['fisic', 'motoria'], ['relig', 'religione'], ['ital', 'italiano'], ['poes', 'italiano'], ['lett', 'italiano']];
  return (regole.find(([k]) => s.includes(k)) || [, s])[1];
}
const MONDI = {
  spazio: { viaggiatore: '🚀', meta: '🪐', dorso: '⭐' },
  papiro: { viaggiatore: '🐎', meta: '🏛️', dorso: '🏺' },
  mare:   { viaggiatore: '⛵', meta: '🏝️', dorso: '🧭' }
};
const TIPI = {
  quiz:      { nome: 'Quiz a tempo', ico: '⏱️' },
  verofalso: { nome: 'Vero o falso', ico: '⚖️' },
  completa:  { nome: 'Completa la frase', ico: '✏️' },
  abbina:    { nome: 'Abbina le coppie', ico: '🔗' },
  memory:    { nome: 'Memory', ico: '🃏' },
  ordina:    { nome: 'Metti in ordine', ico: '🪜' },
  anagramma: { nome: 'Parole mescolate', ico: '🔤' },
  componi:   { nome: 'Componi la frase', ico: '🧩' },
  categorie: { nome: 'Dividi in gruppi', ico: '🗂️' },
  cartina:   { nome: 'Cartina muta', ico: '🗺️' }
};
// Cartine mute: lat/lon -> posizione in % sull'immagine (proiezione dello script che ha fatto l'SVG)
const MAPPE = {
  italia: { file: 'mappe/italia.svg', lon0: 6.5, lat1: 47.2, k: Math.cos(42 * Math.PI / 180), sx: 111.209, w: 1000, h: 1190 },
  // regioni: stessa proiezione di italia.svg, ritagliata (vx, vy = angolo del ritaglio)
  puglia:     { file: 'mappe/puglia.svg',     vx: 656, vy: 543, w: 378, h: 323 },
  basilicata: { file: 'mappe/basilicata.svg', vx: 712, vy: 656, w: 163, h: 175 },
  campania:   { file: 'mappe/campania.svg',   vx: 576, vy: 609, w: 216, h: 215 },
  calabria:   { file: 'mappe/calabria.svg',   vx: 721, vy: 752, w: 197, h: 315 },
  sicilia:    { file: 'mappe/sicilia.svg',    vx: 406, vy: 922, w: 393, h: 295 },
  sardegna:   { file: 'mappe/sardegna.svg',   vx: 98,  vy: 625, w: 214, h: 339 }
};
function posMappa(m, pt) {
  if (pt.x != null) return [pt.x, pt.y];
  const P = MAPPE.italia;
  return [((pt.lon - P.lon0) * P.k * P.sx - (m.vx || 0)) / m.w * 100, ((P.lat1 - pt.lat) * P.sx - (m.vy || 0)) / m.h * 100];
}
const ALTRE_MATERIE = {
  italiano: { nome: 'Italiano', icona: '📖' }, inglese: { nome: 'Inglese', icona: '💂' }, scienze: { nome: 'Scienze', icona: '🔬' },
  arte: { nome: 'Arte', icona: '🎨' }, musica: { nome: 'Musica', icona: '🎵' }, tecnologia: { nome: 'Tecnologia', icona: '💻' },
  religione: { nome: 'Religione', icona: '🕊️' }, 'educazione fisica': { nome: 'Ed. fisica', icona: '⚽' }
};
const infoMateria = k => materie()[k] || ALTRE_MATERIE[k] || { nome: k ? k[0].toUpperCase() + k.slice(1) : 'Altro', icona: '📘' };
const AVATAR = ['🦊','🐱','🐼','🦄','🐸','🐧','🦉','🐬','🦋','🐯','🐨','🐙'];

let DATI = carica('ae_dati', null);
let PROG = carica('ae_prog', { punti: 0, partite: 0, giochi: {}, compitiFatti: {}, temiVisti: [] });
let PROF = carica('ae_prof', null);
let PONTE = carica('ae_ponte', []); // compiti arrivati da Scuola Online
const salvaProg = () => { salva('ae_prog', PROG); cloudPresto(); };
// Guscio Android (APK): la pagina gira dentro una WebView che espone window.GinnyApp
const APP = window.GinnyApp || null;

/* Punto di aggancio per la futura classifica con le amiche (Firebase).
   Per ora non invia nulla: tutto resta sul tablet. */
const Sync = {
  attivo: false,
  async inviaPartita(_partita) {},
  async classifica() { return []; }
};

async function aggiornaDati() {
  try {
    const r = await fetch('data/contenuti.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw 0;
    const nuovi = await r.json();
    const prima = DATI;
    DATI = nuovi; salva('ae_dati', DATI);
    if (prima && nuovi.versione > prima.versione) {
      const idPrima = new Set(prima.temi.map(t => t.id));
      const n = nuovi.temi.filter(t => !idPrima.has(t.id)).length;
      toast(n ? `Sono arrivati ${n === 1 ? 'un tema nuovo' : n + ' temi nuovi'}!` : 'Esercizi e compiti aggiornati');
    }
    if (!location.hash.startsWith('#/gioco')) render();
    aggiornaCompiti();
  } catch { if (!DATI) $('#app').innerHTML = '<div class="vuoto">Per la prima apertura serve internet. Collegati e riapri l\'app.</div>'; }
}
async function aggiornaCompiti() {
  if (!DATI?.ponte) return;
  try {
    const r = await fetch(DATI.ponte, { cache: 'no-store' });
    const j = await r.json();
    if (!Array.isArray(j.compiti)) throw 0;
    const nuovi = j.compiti.filter(c => !PONTE.some(x => x.id === c.id)).length;
    PONTE = j.compiti; salva('ae_ponte', PONTE);
    if (nuovi && carica('ae_ponte_ok', false)) toast(nuovi === 1 ? 'È arrivato un compito nuovo' : `Sono arrivati ${nuovi} compiti nuovi`);
    salva('ae_ponte_ok', true);
    if (!location.hash.startsWith('#/gioco')) render();
  } catch {} // senza internet restano gli ultimi compiti scaricati
  aggiornaPallino();
}
// pallino sull'icona: compiti da oggi in poi non ancora fatti
function aggiornaPallino() {
  if (!navigator.setAppBadge || !DATI) return;
  const n = tuttiCompiti().filter(c => c.data >= oggiISO() && !PROG.compitiFatti[c.id]).length;
  (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
}
/* ---------- notifiche push ---------- */
const urlPonte = p => DATI?.ponte ? DATI.ponte.replace(/\/compiti$/, p) : null;
const notificheOk = () => 'PushManager' in window && 'Notification' in window && !!DATI?.ponte;
async function attivaNotifiche(btn, ruolo = 'figlio') {
  try {
    if (await Notification.requestPermission() !== 'granted') { toast('Notifiche bloccate: attivale dalle impostazioni di Chrome'); return; }
    const { chiave } = await (await fetch(urlPonte('/vapid'))).json();
    if (!chiave) throw 0;
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true,
      applicationServerKey: Uint8Array.from(atob(chiave.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0)) });
    let q = '';
    if (ruolo === 'genitore') { const codice = chiediCodice(); if (!codice) return; q = '?ruolo=genitore&codice=' + encodeURIComponent(codice); }
    const r = await fetch(urlPonte('/iscrivi') + q, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(sub) });
    if (r.status === 403) { salva('ae_codfoto', ''); toast('Codice sbagliato, riprova'); return; }
    if (!r.ok) throw 0;
    await salvaRuolo(ruolo);
    toast(ruolo === 'genitore' ? 'Ti avviso quando arriva una foto! 📷' : 'Notifiche attivate! 🔔');
    if (btn) btn.outerHTML = '<p class="muted">🔔 Notifiche dei compiti attive</p>';
    if (location.hash === '#/genitore') render();
  } catch { toast('Non sono riuscito ad attivare le notifiche'); }
}
function tuttiCompiti() {
  const visti = new Set(), out = [];
  for (const c of [...(DATI.compiti || []), ...PONTE]) if (!visti.has(c.id)) { visti.add(c.id); out.push({ ...c, materia: normMateria(c.materia) }); }
  return out;
}
function temaDelCompito(c) {
  if (c.tema) return tema(c.tema);
  const t = (c.testo || '').toLowerCase();
  const pag = pagineDi(c.testo);
  return DATI.temi.find(x => x.materia === c.materia && (x.parole || []).some(p => t.includes(p.toLowerCase())))
    || DATI.temi.find(x => x.materia === c.materia && (x.pagine || []).some(n => pag.includes(n)));
}
const materie = () => ({ ...MATERIE_BASE, ...(DATI?.materie || {}) });
const tema = id => DATI?.temi.find(t => t.id === id);
const chiaveG = (tid, i) => tid + '#' + i;
function stelleTema(t) { return t.giochi.reduce((s, _, i) => s + (PROG.giochi[chiaveG(t.id, i)]?.stelle || 0), 0); }
function stelleTotali() { return Object.values(PROG.giochi).reduce((s, g) => s + (g.stelle || 0), 0); }
const str = n => '⭐'.repeat(n) + '<span style="opacity:.25">' + '⭐'.repeat(3 - n) + '</span>';

/* ---------- progressi online (repo privata, tramite il ponte) ---------- */
// Si salvano ae_prog, ae_piano e ae_prof in progressi/<nome>.json. Serve il codice delle foto.
// Salvataggio automatico 15 s dopo un cambiamento (fine partita, compito spuntato, piano) e quando l'app va in background.
const quando = ts => new Date(ts).toLocaleString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const slugNome = n => (n || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 30);
const impronta = s => { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; };
let cloudT = null;
function cloudPresto() {
  if (!PROF || !DATI?.ponte || !carica('ae_codfoto', '')) return;
  clearTimeout(cloudT); cloudT = setTimeout(() => salvaOnline(false), 15000);
}
function statoCloud() {
  const c = carica('ae_cloud', null);
  return c ? `Ultimo salvataggio: ${quando(c.quando)} (nome "${c.nome}")` : 'Non ancora salvati online. Si salvano da soli dopo ogni partita (serve il codice di papà).';
}
async function salvaOnline(aMano) {
  clearTimeout(cloudT); cloudT = null;
  if (!PROF || !DATI?.ponte) return false;
  const codice = aMano ? chiediCodice() : carica('ae_codfoto', ''); if (!codice) return false;
  const dati = { ae_prog: PROG, ae_piano: PIANO, ae_prof: PROF }, nome = slugNome(PROF.nome), firma = impronta(nome + JSON.stringify(dati));
  if (!aMano && firma === carica('ae_cloud_firma', 0)) return true; // niente di nuovo
  try {
    const r = await fetch(urlPonte('/progressi'), { method: 'POST', keepalive: true, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ codice, nome, dati }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 403) { salva('ae_codfoto', ''); if (aMano) toast('Codice sbagliato, riprova'); return false; }
    if (!r.ok) throw new Error(j.errore || 'errore ' + r.status);
    salva('ae_cloud', { quando: Date.now(), nome }); salva('ae_cloud_firma', firma);
    if (aMano) toast('☁️ Progressi salvati!');
    return true;
  } catch (e) { if (aMano) toast('Non salvati: ' + (e instanceof TypeError ? 'manca internet?' : e.message), 5000); return false; }
}
async function recuperaOnline() {
  if (!DATI?.ponte) return toast('Aspetta un attimo, sto caricando…');
  const nome = slugNome((prompt('Con quale nome avevi salvato i progressi?', PROF?.nome || '') || '').trim()); if (!nome) return;
  const codice = chiediCodice(); if (!codice) return;
  try {
    const r = await fetch(urlPonte('/progressi') + `?nome=${encodeURIComponent(nome)}&codice=${encodeURIComponent(codice)}`, { cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (r.status === 403) { salva('ae_codfoto', ''); return toast('Codice sbagliato, riprova'); }
    if (r.status === 404) return toast(`Nessun salvataggio con il nome "${nome}"`, 5000);
    if (!r.ok || !j.dati?.ae_prog) throw new Error(j.errore || 'errore ' + r.status);
    const d = j.dati, st = Object.values(d.ae_prog.giochi || {}).reduce((s, g) => s + (g.stelle || 0), 0);
    if (!confirm(`Ho trovato i progressi di ${d.ae_prof?.nome || nome}: ${st} stelle e ${d.ae_prog.punti || 0} punti, salvati ${quando(j.salvato)}.\n\nLi carico su questo dispositivo al posto di quelli di adesso?`)) return;
    PROG = { punti: 0, partite: 0, giochi: {}, compitiFatti: {}, temiVisti: [], ...d.ae_prog }; salva('ae_prog', PROG);
    PIANO = d.ae_piano || {}; salva('ae_piano', PIANO);
    if (d.ae_prof?.nome) { PROF = d.ae_prof; salva('ae_prof', PROF); }
    salva('ae_cloud', { quando: Date.parse(j.salvato) || Date.now(), nome }); salva('ae_cloud_firma', impronta(nome + JSON.stringify({ ae_prog: PROG, ae_piano: PIANO, ae_prof: PROF })));
    $('#nav').style.display = ''; toast('🎉 Progressi recuperati!'); suono('fine');
    location.hash = '#/casa'; render(); aggiornaPallino();
  } catch (e) { toast('Non recuperati: ' + (e instanceof TypeError ? 'manca internet?' : e.message), 5000); }
}

/* ---------- router ---------- */
window.addEventListener('hashchange', render);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-go]'); if (b) { location.hash = b.dataset.go; }
});

function render() {
  const app = $('#app'), h = location.hash || '#/casa', [, pag, a, b] = h.split('/');
  chiudiGioco();
  document.body.classList.toggle('in-casa', !pag || pag === 'casa');
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', h.startsWith(x.dataset.go) || (pag === 'materia' || pag === 'tema') && x.dataset.go === '#/casa'));
  if (pag === 'genitore') return paginaGenitore(app);
  if (!PROF) return paginaProfilo(app, true);
  if (!DATI) { app.innerHTML = '<p class="muted">Carico gli esercizi…</p>'; return; }
  window.scrollTo(0, 0);
  if (pag === 'materia') return paginaMateria(app, a);
  if (pag === 'tema') return paginaTema(app, decodeURIComponent(a));
  if (pag === 'gioco') return avviaGioco(decodeURIComponent(a), +b);
  if (pag === 'compiti') return paginaCompiti(app);
  if (pag === 'piano') return paginaPiano(app);
  if (pag === 'premi') return paginaPremi(app);
  return paginaCasa(app);
}

/* ---------- pagine ---------- */
function paginaCasa(app) {
  const M = materie();
  const prossimi = tuttiCompiti().filter(c => c.data >= oggiISO()).sort((x, y) => x.data.localeCompare(y.data));
  // materie: prima quelle con il tema più recente (ultimo aggiunto in contenuti.json), poi le altre
  const ultimo = k => DATI.temi.reduce((u, t, i) => t.materia === k ? i : u, -1);
  const ordine = Object.keys(M).sort((a, b) => ultimo(b) - ultimo(a));
  app.innerHTML = `<div class="casa">
    <div class="top">
      <div class="avatar">${PROF.avatar}</div>
      <div><h1>Ciao ${esc(PROF.nome)}!</h1><div class="muted">Cosa ripassiamo oggi?</div></div>
      <div class="mia-casa"><div class="fumetto">${aCaso([`Ciao! Sono ${guida().nome}, giochiamo insieme?`, 'Eccoti! Che bello rivederti!', 'Oggi impariamo qualcosa di nuovo!'])}</div><img src="${miaSrc('fullbody', 'master')}" alt="${guida().nome}"></div>
      <div class="stelle-tot">⭐ ${stelleTotali()}</div>
    </div>
    <div class="zona-testa"><h2>Prossimi compiti</h2>
      <button class="btn piccolo" data-go="#/piano">🗓️ Il mio piano</button>
      <button class="btn piccolo bianco" id="orario">🎒 Zaino</button>
      <button class="btn piccolo bianco" data-go="#/compiti">📒 Tutti</button></div>
    <div class="zona" id="zonaCompiti">
      ${prossimi.length ? prossimi.map(compitoHTML).join('') : '<div class="vuoto">Nessun compito in arrivo. Puoi giocare quanto vuoi!</div>'}

// "pag. 40", "pagg. 40-42", "pagina 12 e 13", "p. 7" -> [40, 41, 42]
function pagineDi(t) {
  const out = [];
  for (const m of (t || '').matchAll(/\b(?:pagg?\.?|pagin[ae]|p\.)\s*(\d{1,3})(?:\s*(?:-|–|al|e|,)\s*(\d{1,3}))?/gi)) {
    const a = +m[1], b = m[2] && +m[2] > a && +m[2] - a < 8 ? +m[2] : a;
    for (let n = a; n <= b; n++) if (!out.includes(n)) out.push(n);
  }
  return out;
}

/* Foto di compiti/schede: rimpicciolita e mandata al ponte, che la mette nella repo privata */
function chiediCodice() {
  let codice = carica('ae_codfoto', '');
  if (!codice) { codice = (prompt('Codice segreto (lo sa papà):') || '').trim(); if (codice) salva('ae_codfoto', codice); }
  return codice;
}
async function inviaFoto(inp, nome = 'scheda', idCompito = null) {
  const f = inp.files[0]; inp.value = ''; if (!f) return;
  const codice = chiediCodice(); if (!codice) return;
  toast('Invio la foto…');
  try {
    const img = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const dati = c.toDataURL('image/jpeg', 0.8).split(',')[1];
    const r = await fetch(urlPonte('/foto'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ codice, nome, dati }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 403) { salva('ae_codfoto', ''); return toast('Codice sbagliato, riprova'); }
    if (!r.ok) throw new Error(j.errore || 'errore ' + r.status);
    if (idCompito) { (PROG.fotoInviate ||= {})[idCompito] = Date.now(); salvaProg(); if (!location.hash.startsWith('#/gioco')) render(); }
    toast('Foto inviata! Presto arrivano i giochi nuovi 🎉');
  } catch (e) {
    toast('❌ Foto NON inviata: ' + (e instanceof TypeError ? 'manca internet?' : e.message) + '. Riprova.', 6000);
  }
}

/* ---------- Il mio piano: i compiti diventano carte da mettere sui giorni ---------- */
// PIANO = { idCompito: { g: 'AAAA-MM-GG' (giorno in cui lo fa), min: minuti stimati } }, solo sul tablet
let PIANO = carica('ae_piano', {}), pianoSel = null;
const salvaPiano = () => { salva('ae_piano', PIANO); cloudPresto(); };
const TEMPI = [15, 30, 45, 60, 90];
const GIORNO_PIENO = 90; // minuti
const isoPiu = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };
const minDi = c => PIANO[c.id]?.min || (c.verifica ? 60 : 30);
const GBREVE = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
const giornoBreve = iso => { const n = nomeGiorno(iso); return /^(Oggi|Domani)$/.test(n) ? n : (d => GBREVE[d.getDay()] + ' ' + d.getDate())(new Date(iso + 'T12:00:00')); };
const coloreMat = k => infoMateria(k).colore || { matematica: 'var(--mate)', storia: 'var(--storia)', geografia: 'var(--geo)' }[k] || '#999';
function paginaPiano(app) {
  const oggi = oggiISO(), tutti = tuttiCompiti();
  // compiti ancora da consegnare (anche quelli fatti, per vederli barrati nel giorno)
  const attivi = tutti.filter(c => c.data >= oggi).sort((x, y) => x.data.localeCompare(y.data));
  // un piano messo su un giorno passato torna "da organizzare"
  for (const c of attivi) if (PIANO[c.id]?.g && PIANO[c.id].g < oggi && !PROG.compitiFatti[c.id]) delete PIANO[c.id].g;
  const fine = attivi.reduce((m, c) => c.data > m ? c.data : m, isoPiu(oggi, 6));

let AC = null, audioOn = carica('ae_audio', true);
// Android sospende l'audio quando l'app va in background: lo riaccendiamo prima di ogni suono e al ritorno
function audioPronto() {
  if (!AC || AC.state === 'closed') AC = new (window.AudioContext || window.webkitAudioContext)();
  if (AC.state !== 'running') AC.resume().catch(() => {});
  return AC;
}

// una nota: onda, frequenza (anche scivolata fino a f2), inizio, durata, volume
function nota(ac, { f, f2, t = 0, d = 0.3, v = 0.2, onda = 'sine' }) {
  const t0 = ac.currentTime + 0.03 + t, o = ac.createOscillator(), g = ac.createGain();

  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);

}
function suono(tipo) {

    const ac = audioPronto();

    else if (tipo === 'ko') { nota(ac, { f: 330, f2: 140, d: 0.38, v: 0.22 }); nota(ac, { f: 335, f2: 145, d: 0.38, v: 0.08, onda: 'triangle' }); } // boing morbido
    else if (tipo === 'fine') { // fanfara: arpeggio e accordo finale
      [523.3, 659.3, 784, 1046.5].forEach((f, i) => { nota(ac, { f, t: i * 0.13, d: 0.3, v: 0.13, onda: 'triangle' }); nota(ac, { f: f * 2, t: i * 0.13, d: 0.2, v: 0.04 }); });

    }

}

/* ---------- i giochi ---------- */
const MOTORI = {
  /* domande a scelta: quiz, completa (r[0] = giusta) */
  quiz(p, g) { scelte(p, (g.domande || []).map(d => ({ testo: esc(d.d), giusta: d.r[0], opz: d.r })), 18); },
  completa(p, g) {
    scelte(p, (g.frasi || []).map(d => ({ testo: esc(d.f).replace(/_{2,}/, '<span class="lacuna"></span>'), giusta: d.r[0], opz: d.r, lacuna: true })), 20);
  },
  verofalso(p, g) { scelte(p, (g.frasi || []).map(d => ({ testo: esc(d.f), giusta: d.v ? 'Vero' : 'Falso', opz: ['Vero', 'Falso'], fisse: true })), 10); },

  categorie(p, g) {

    const gruppi = Object.keys(g.gruppi || {});
    const carte = mescola(gruppi.flatMap(k => g.gruppi[k].map(v => ({ v, k })))).slice(0, 12);
    G.totale = carte.length; let i = 0; hud();

      p.innerHTML = `<div class="domanda" style="font-size:22px">Dove va?</div><div class="carta-cat">${esc(c.v)}</div>
        <div class="opzioni">${gruppi.map(k => `<button class="opz" data-k="${esc(k)}">${esc(k)}</button>`).join('')}</div>`;
      let chiuso = false;
      const stop = timer(12, () => rispondi(null));
      const rispondi = b => {
        if (chiuso) return; chiuso = true; const resto = stop();
        const giusto = p.querySelector(`[data-k="${CSS.escape(c.k)}"]`);
        if (b && b.dataset.k === c.k) { b.classList.add('giusta'); bene(b, Math.round(resto * 10)); }
        else { b?.classList.add('sbagliata'); giusto.classList.add('giusta'); if (!male(b)) return; }
        avanza(); i++; setTimeout(giro, b && b.dataset.k === c.k ? 650 : 1300);
      };
      p.querySelectorAll('.opz').forEach(b => b.onclick = () => rispondi(b));
    };
    giro();
  },

  abbina(p, g) {
    const coppie = mescola(g.coppie || []).slice(0, 6); G.totale = coppie.length; hud();
    const sx = mescola(coppie.map((c, i) => ({ v: c[0], i }))), dx = mescola(coppie.map((c, i) => ({ v: c[1], i })));
    p.innerHTML = `<div class="domanda" style="font-size:24px">Tocca un elemento a sinistra e poi quello giusto a destra</div>
      <div class="colonne">${sx.map((a, n) => `<button class="opz" data-l="${a.i}">${esc(a.v)}</button><button class="opz" data-r="${dx[n].i}">${esc(dx[n].v)}</button>`).join('')}</div>`;
    let sel = null, fatte = 0;
    p.querySelectorAll('.opz').forEach(b => b.onclick = () => {
      if (b.classList.contains('fatta')) return;
      if (!sel || (sel.dataset.l !== undefined) === (b.dataset.l !== undefined)) { sel?.classList.remove('scelta'); sel = b; b.classList.add('scelta'); suono('gira'); return; }
      const a = sel; sel = null; a.classList.remove('scelta');
      if ((a.dataset.l ?? a.dataset.r) === (b.dataset.l ?? b.dataset.r)) {
        a.classList.add('fatta'); b.classList.add('fatta'); bene(b); avanza();
        if (++fatte === coppie.length) setTimeout(fine, 700);
      } else { male(b); a.classList.add('scuoti'); setTimeout(() => a.classList.remove('scuoti'), 400); }
    });
  },

  memory(p, g) {
    G.pesoErr = 0.5;
    const coppie = mescola(g.coppie || []).slice(0, 6); G.totale = coppie.length; hud();
    const carte = mescola(coppie.flatMap((c, i) => [{ v: c[0], i }, { v: c[1], i }]));
    p.innerHTML = `<div class="domanda" style="font-size:24px">Trova le coppie che vanno insieme</div>
      <div class="griglia-memory">${carte.map((c, n) => `<button class="mcard" data-n="${n}" aria-label="Carta"><div class="dentro">
        <div class="faccia dorso">${G.W.dorso}</div><div class="faccia fronte">${esc(c.v)}</div></div></button>`).join('')}</div>`;
    let aperte = [], blocco = false, prese = 0;
    p.querySelectorAll('.mcard').forEach(b => b.onclick = () => {
      if (blocco || b.classList.contains('girata') || b.classList.contains('presa')) return;
      b.classList.add('girata'); suono('gira'); aperte.push(b);
      if (aperte.length < 2) return;
      const [x, y] = aperte; aperte = [];
      if (carte[x.dataset.n].i === carte[y.dataset.n].i) {
        setTimeout(() => { x.classList.replace('girata', 'presa'); y.classList.replace('girata', 'presa'); bene(y); avanza(); if (++prese === coppie.length) setTimeout(fine, 700); }, 350);
      } else {
        blocco = true; G.errori++; G.serie = 0; hud();
        setTimeout(() => { x.classList.remove('girata'); y.classList.remove('girata'); blocco = false; }, 1000);
      }
    });
  },

  cartina(p, g) {
    const m = MAPPE[g.mappa] || MAPPE.italia, ICO = { monte: '▲', fiume: '〰', lago: '💧', regione: '◆' };
    const punti = mescola(g.punti || []).slice(0, 8); G.totale = punti.length; hud();
    p.innerHTML = `<div class="domanda" style="font-size:22px">Trascina il nome sul punto giusto (o tocca il punto)</div>
      <div class="cart-nome"></div>
      <div class="cartina" style="aspect-ratio:${m.w}/${m.h}"><img src="${m.file}" alt="" draggable="false">
        ${punti.map((pt, i) => { const [x, y] = posMappa(m, pt); return `<button class="pin pin-${pt.tipo || 'citta'}" data-i="${i}" style="left:${x}%;top:${y}%">${ICO[pt.tipo] || ''}</button>`; }).join('')}</div>`;
    const nome = $('.cart-nome', p), pins = [...p.querySelectorAll('.pin')];
    let ordine = mescola(punti.map((_, i) => i)), cur;
    const prossimo = () => {
      if (!ordine.length) return setTimeout(fine, 600);
      cur = ordine.shift(); nome.textContent = punti[cur].n; nome.style.transform = ''; nome.classList.remove('sbagliata');
    };
    const prova = pin => {
      if (!pin || pin.classList.contains('fatta')) return;
      if (+pin.dataset.i === cur) {
        pin.classList.add('fatta'); pin.title = punti[cur].n;
        const et = document.createElement('span'); et.className = 'pin-et'; et.textContent = punti[cur].n; pin.append(et);
        bene(pin); avanza(); prossimo();
      } else { male(pin); pin.classList.add('scuoti'); setTimeout(() => pin.classList.remove('scuoti'), 400); ordine.push(cur); prossimo(); }
    };
    pins.forEach(b => b.onclick = () => prova(b));
    // trascinamento del nome: vale il punto libero più vicino entro 45 px
    let x0, y0;
    nome.onpointerdown = e => { x0 = e.clientX; y0 = e.clientY; nome.setPointerCapture(e.pointerId); nome.classList.add('trascina'); };
    nome.onpointermove = e => { if (x0 != null) nome.style.transform = `translate(${e.clientX - x0}px,${e.clientY - y0}px)`; };
    nome.onpointerup = e => {
      if (x0 == null) return; x0 = null; nome.classList.remove('trascina'); nome.style.transform = '';
      let best = null, bd = 45;
      pins.forEach(b => { if (b.classList.contains('fatta')) return; const r = b.getBoundingClientRect(), d = Math.hypot(r.x + r.width / 2 - e.clientX, r.y + r.height / 2 - e.clientY); if (d < bd) { bd = d; best = b; } });
      if (best) prova(best);
    };
    prossimo();
  },

  ordina(p, g) {
    const el = g.elementi || []; G.totale = el.length; hud();
    p.innerHTML = `<div class="domanda" style="font-size:24px">${esc(g.istruzione || 'Tocca gli elementi nell\'ordine giusto')}</div>
      <div class="sequenza"></div><div class="mucchio">${mescola(el.map((v, i) => ({ v, i }))).map(o => `<button class="tassello" data-i="${o.i}">${esc(o.v)}</button>`).join('')}</div>`;
    let prossimo = 0; const seq = $('.sequenza', p);
    p.querySelectorAll('.mucchio .tassello').forEach(b => b.onclick = () => {
      if (+b.dataset.i === prossimo) {
        prossimo++; b.remove(); const n = document.createElement('div'); n.className = 'tassello';
        n.innerHTML = `<span class="n">${prossimo}</span>${esc(el[prossimo - 1])}`; n.style.animation = 'pop .35s'; seq.append(n);
        bene(n); avanza(); if (prossimo === el.length) setTimeout(fine, 700);
      } else male(b);
    });
  },

  // componi: le parole di ogni frase (o verso) mescolate, si toccano nell'ordine giusto; una frase per giro
  componi(p, g) {
    const frasi = (g.frasi || []).slice(0, 8); G.totale = frasi.length; hud(); let i = 0;
    const giro = () => {
      if (i >= frasi.length) return fine();
      const parole = frasi[i].split(/\s+/).filter(Boolean); let prossimo = 0, errori = 0;
      p.innerHTML = `<div class="domanda" style="font-size:22px">${esc(g.istruzione || 'Tocca le parole nell\'ordine giusto')}</div>
        <div class="sequenza"></div><div class="mucchio">${mescola(parole.map((v, n) => ({ v, n }))).map(o => `<button class="tassello" data-n="${o.n}">${esc(o.v)}</button>`).join('')}</div>`;
      const seq = $('.sequenza', p);
      p.querySelectorAll('.mucchio .tassello').forEach(b => b.onclick = () => {
        // vale anche una parola uguale a quella attesa (es. due "e" nella stessa frase)
        if (b.textContent === parole[prossimo]) {
          prossimo++; b.remove(); const t = document.createElement('div'); t.className = 'tassello'; t.textContent = parole[prossimo - 1];
          t.style.animation = 'pop .35s'; seq.append(t);
          if (prossimo === parole.length) { bene(seq, errori ? 0 : 20); avanza(); i++; setTimeout(giro, 900); }
        } else { errori++; male(b); }
      });
    };
    giro();
  },

  anagramma(p, g) {
    const parole = mescola(g.parole || []).slice(0, 6); G.totale = parole.length; hud(); let i = 0;
    const giro = () => {
      if (i >= parole.length) return fine();
      const w = parole[i], P = w.p.toUpperCase().replace(/\s/g, '');
      let lett = P.split(''); do { lett = mescola(lett); } while (lett.join('') === P && P.length > 1);
      let scelte = [], aiuti = 0;
      p.innerHTML = `<div class="domanda" style="font-size:24px">${esc(w.indizio || 'Riordina le lettere')}</div>
        <div class="caselle">${P.split('').map(() => '<div class="casella"></div>').join('')}</div>
        <div class="lettere">${lett.map((l, n) => `<button class="lettera" data-n="${n}">${l}</button>`).join('')}</div>
        <div class="azioni"><button class="btn bianco" id="cancella">⌫ Cancella</button><button class="btn bianco" id="aiuto">💡 Aiuto</button><button class="btn bianco" id="salta">Salta</button></div>`;
      const caselle = [...p.querySelectorAll('.casella')], tasti = [...p.querySelectorAll('.lettera')];
      const disegna = () => caselle.forEach((c, n) => c.textContent = scelte[n] != null ? lett[scelte[n]] : '');
      const controlla = () => {
        if (scelte.length < P.length) return;
        if (scelte.map(n => lett[n]).join('') === P) { bene($('.caselle', p), aiuti ? 0 : 20); avanza(); i++; setTimeout(giro, 800); }
        else { male($('.caselle', p)); setTimeout(() => { scelte = scelte.slice(0, aiuti); tasti.forEach((t, n) => t.classList.toggle('usata', scelte.includes(n))); disegna(); }, 450); }
      };
      tasti.forEach(t => t.onclick = () => { if (t.classList.contains('usata')) return; scelte.push(+t.dataset.n); t.classList.add('usata'); suono('gira'); disegna(); controlla(); });
      $('#cancella', p).onclick = () => { if (scelte.length > aiuti) { tasti[scelte.pop()].classList.remove('usata'); disegna(); } };
      $('#aiuto', p).onclick = () => {
        scelte.slice(aiuti).forEach(n => tasti[n].classList.remove('usata')); scelte = scelte.slice(0, aiuti);
        if (aiuti >= P.length) return;
        const n = lett.findIndex((l, k) => l === P[aiuti] && !scelte.includes(k));
        scelte.push(n); tasti[n].classList.add('usata'); aiuti++; G.serie = 0; hud(); disegna(); controlla();
      };
      $('#salta', p).onclick = () => { G.errori++; G.serie = 0; scelte = []; caselle.forEach((c, n) => c.textContent = P[n]); suono('ko'); avanza(); i++; setTimeout(giro, 1400); };
    };
    giro();
  }
};

/* motore comune per quiz / completa / vero-falso */
function scelte(p, domande, sec) {
  G.usaVite = true;
  const lista = mescola(domande).slice(0, 10); G.totale = lista.length; hud(); let i = 0;
  const giro = () => {
    if (i >= lista.length) return fine();
    const d = lista[i], opz = d.fisse ? d.opz : mescola(d.opz);
    p.innerHTML = `<div class="domanda">${d.testo}</div>
      <div class="${d.fisse ? 'vf' : 'opzioni'}">${opz.map(o => `<button class="opz">${esc(o)}</button>`).join('')}</div>`;
    const bottoni = [...p.querySelectorAll('.opz')]; let chiuso = false;
    const stop = timer(sec, () => rispondi(null));
    const rispondi = b => {
      if (chiuso) return; chiuso = true; const resto = stop();
      const giusto = bottoni[opz.indexOf(d.giusta)];
      bottoni.forEach(x => x !== b && x !== giusto && x.classList.add('spenta'));
      if (d.lacuna) $('.lacuna', p).textContent = d.giusta;
      if (b === giusto) { b.classList.add('giusta'); bene(b, Math.round(resto * 10)); }
      else { b?.classList.add('sbagliata'); giusto.classList.add('giusta'); if (!male(b)) return; }
      avanza(); i++; setTimeout(giro, b === giusto ? 700 : 1500);
    };
    bottoni.forEach(b => b.onclick = () => rispondi(b));
  };
  giro();
}

/* ---------- avvio ---------- */
render();
aggiornaDati();
document.addEventListener('visibilitychange', () => { if (!document.hidden) aggiornaDati(); else if (cloudT) salvaOnline(false); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
